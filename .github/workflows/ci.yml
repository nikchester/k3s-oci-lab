name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
      - name: Format
        run: terraform fmt -check -recursive
      - name: Init without backend
        run: terraform init -backend=false -lockfile=readonly -input=false
      - name: Validate
        run: terraform validate

  ansible:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: python3 -m pip install --user ansible-core ansible-lint
      - name: Syntax check
        run: ansible-playbook -i inventory.ini.example site.yml --syntax-check
      - name: Ansible lint
        run: ansible-lint site.yml
